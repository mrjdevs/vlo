[package]
name = "vlo"
version = "0.8.2"
edition = "2021"
authors = ["MRJDEV <mrjdev@gmail.com>"]
description = "VLO - A zero-boilerplate full-stack web framework"
license = "MIT"
repository = "https://github.com/mrjdevs/vlo.git"

[dependencies]
# Web framework & HTTP routing
axum = { version = "0.7", features = ["macros", "http1", "json", "query", "tokio"] }

# Asynchronous runtime & streaming
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs"] }
async-stream = "0.3"
futures-util = "0.3"

# Command line interface
clap = { version = "4", features = ["derive"] }

# File system, watching, & utilities
notify = "6"
regex = "1.10"
serde_json = "1.0"
dotenvy = "0.15"

# Multi-database support (SQLite, PostgreSQL, MySQL)
sqlx = {
    version = "0.8",
    default-features = false,
    features = [
        "runtime-tokio",
        "tls-rustls",
        "sqlite",
        "postgres",
        "mysql",
        "json"
    ]
}

tower-http = { version = "0.5.2", features = ["fs", "compression-gzip"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "vlo"
path = "src/main.rs"
