[package]
name = "vlo"
version = "0.1.1"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
notify = "6"
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
async-stream = "0.3"
regex = "1.10"
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
