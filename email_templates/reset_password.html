<!-- subject: Reset Your {{app_name}} Password -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .btn { display: inline-block; padding: 12px 24px; background: #00f5ff; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Your Password</h1>
        <p>Hello {{email}},</p>
        <p>We received a request to reset the password for your {{app_name}} account. If you didn't make this request, you can safely ignore this email.</p>
        <p style="text-align: center; margin: 30px 0;">
            <a href="{{reset_link}}" class="btn">Reset My Password</a>
        </p>
        <p style="color: #666; font-size: 12px;">For your security, this link will expire in 1 hour.</p>
    </div>
</body>
</html>
