<!-- subject: Action Required: Activate Your {{app_name}} Account -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; }
        .btn { display: inline-block; padding: 12px 24px; background: #00f5ff; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Activate Your Account</h1>
        <p>Hello {{email}},</p>
        <p>It looks like your {{app_name}} account is still pending activation. To get full access to all features, please verify your email address using the link below.</p>
        <p style="text-align: center; margin: 30px 0;">
            <a href="{{activation_link}}" class="btn">Activate My Account</a>
        </p>
        <p style="color: #666; font-size: 12px;">If you no longer wish to use this account, you can safely ignore this email.</p>
    </div>
</body>
</html>
